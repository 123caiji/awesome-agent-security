name: update-index

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh stars and descriptions
        run: node scripts/refresh-stars.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render README tables
        run: node scripts/render.mjs
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh index (stars + descriptions)"
          # 用账号本人的 noreply 邮箱提交，自动提交才会计入贡献图
          commit_user_name: 123caiji
          commit_user_email: 166346449+123caiji@users.noreply.github.com
          commit_author: 123caiji <166346449+123caiji@users.noreply.github.com>
