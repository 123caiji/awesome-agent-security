<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>awesome-agent-security · AI Agent 安全与 DSH 生态</title>
<style>
  :root { --bg:#0d1117; --fg:#c9d1d9; --dim:#8b949e; --line:#21262d; --acc:#3fb950; --link:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif; }
  header { padding:40px 20px 12px; max-width:980px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  header p { color:var(--dim); margin:0 0 18px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input[type=search] { flex:1; min-width:220px; padding:8px 12px; background:#161b22; border:1px solid var(--line); border-radius:6px; color:var(--fg); outline:none; }
  input[type=search]:focus { border-color:#30363d; }
  .count { color:var(--dim); font-variant-numeric:tabular-nums; }
  main { max-width:980px; margin:0 auto; padding:0 20px 60px; }
  h2 { font-size:15px; margin:34px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); color:var(--acc); font-weight:600; }
  .card { padding:12px 0; border-bottom:1px solid var(--line); }
  .card:last-child { border-bottom:none; }
  .t { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .t a { color:var(--link); text-decoration:none; font-weight:600; }
  .t a:hover { text-decoration:underline; }
  .stars { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .lang { color:var(--dim); font-size:12px; }
  .desc { color:var(--fg); margin:4px 0 0; }
  .note { color:var(--dim); font-size:13px; margin:4px 0 0; }
  .topics { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .topics span { font-size:11px; color:var(--link); background:#121d2f; border:1px solid #1f3a5f; padding:1px 7px; border-radius:10px; }
  footer { max-width:980px; margin:0 auto; padding:0 20px 40px; color:var(--dim); font-size:12px; }
  footer a { color:var(--link); }
  .empty { color:var(--dim); padding:30px 0; }
</style>
</head>
<body>
<header>
  <h1>awesome-agent-security</h1>
  <p>AI Agent 安全工具 + DeepSeek Harness 插件生态。<span id="n"></span></p>
  <div class="bar">
    <input id="q" type="search" placeholder="搜仓库名 / 描述 / topic / 分区…" autocomplete="off" />
    <span class="count" id="c"></span>
  </div>
</header>
<main id="list"></main>
<footer>
  数据：<a href="https://github.com/123caiji/awesome-agent-security/blob/main/data/index.json">data/index.json</a>
  · 仓库：<a href="https://github.com/123caiji/awesome-agent-security">github.com/123caiji/awesome-agent-security</a>
  · 每次索引更新由 <code>update-index</code> workflow 推送，页面直接读这份 JSON。
</footer>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n == null ? '—' : n));
let ALL = [];
function render(q) {
  const kw = (q || '').trim().toLowerCase();
  const hit = kw ? ALL.filter((r) => [r.name, r.owner, r.desc, r.note, r.lang, r.section, (r.topics || []).join(' ')].join(' ').toLowerCase().includes(kw)) : ALL;
  const groups = [];
  for (const r of hit) {
    let g = groups.find((x) => x.sec === r.section);
    if (!g) groups.push((g = { sec: r.section, items: [] }));
    g.items.push(r);
  }
  document.getElementById('list').innerHTML = groups.length
    ? groups.map((g) => '<h2>' + esc(g.sec) + ' <span class="count">' + g.items.length + '</span></h2>' + g.items.map(card).join('')).join('')
    : '<p class="empty">没有匹配的仓库</p>';
  document.getElementById('c').textContent = hit.length + ' / ' + ALL.length;
}
function card(r) {
  const topics = (r.topics || []).slice(0, 6).map((t) => '<span>' + esc(t) + '</span>').join('');
  return '<div class="card">'
    + '<div class="t"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.owner + '/' + r.name) + '</a>'
    + '<span class="stars">★ ' + fmt(r.stars) + '</span>'
    + (r.lang ? '<span class="lang">' + esc(r.lang) + '</span>' : '') + '</div>'
    + (r.desc ? '<p class="desc">' + esc(r.desc) + '</p>' : '')
    + (r.note ? '<p class="note">' + esc(r.note) + '</p>' : '')
    + (topics ? '<div class="topics">' + topics + '</div>' : '')
    + '</div>';
}
fetch('./data/index.json', { cache: 'no-store' })
  .then((r) => r.json())
  .then((j) => { ALL = Array.isArray(j) ? j : Object.values(j); document.getElementById('n').textContent = '共 ' + ALL.length + ' 条。'; render(''); })
  .catch((e) => { document.getElementById('list').innerHTML = '<p class="empty">数据加载失败：' + esc(e.message) + '</p>'; });
document.getElementById('q').addEventListener('input', (e) => render(e.target.value));
</script>
</body>
</html>
